name: Docker

on:
  push:
    branches: [dev]
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build & push Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=dev,enable=${{ github.ref_name == 'dev' }}
            type=sha,enable=${{ github.ref_name == 'dev' }},prefix=dev-,format=short

      - name: Compute short commit SHA
        id: sha
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "short=${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"

      - name: Check if image for this commit was already built
        id: existing
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-${{ steps.sha.outputs.short }}"
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push Docker image
        if: steps.existing.outputs.found != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Re-tag existing image for this commit
        if: steps.existing.outputs.found == 'true'
        run: |
          TAGS=()
          while IFS= read -r line; do
            [ -n "$line" ] && TAGS+=(--tag "$line")
          done <<< "${{ steps.meta.outputs.tags }}"
          docker buildx imagetools create "${TAGS[@]}" "${{ steps.existing.outputs.image }}"